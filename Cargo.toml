[workspace]
resolver = "2"
members = [
    "packages/shared-contracts",
    "packages/core-engine",
    "packages/hal-drivers",
    "packages/cluster-gateway",
]

[workspace.package]
version = "3.1.0"
edition = "2021"
license = "Proprietary"
authors = ["RUBE-STOCK-POS Engineering Team"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.11", features = ["v4", "serde"] }
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
rusqlite = { version = "0.32", features = ["bundled", "backup", "functions"] }



